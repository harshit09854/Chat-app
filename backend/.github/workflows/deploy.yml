name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]   # Jab bhi main branch par push hoga, yeh pipeline chalegi

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub se code checkout karein
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Docker Hub par login karein (jo Secrets aapne set kiye the unka use karke)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Docker Image build aur Docker Hub par push karein
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-app:latest